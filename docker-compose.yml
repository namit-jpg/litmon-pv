# Optional — requires Docker. Local dev works with SQLite without Docker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litmon
      POSTGRES_PASSWORD: litmon
      POSTGRES_DB: litmon
    ports:
      - "5432:5432"
    volumes:
      - litmon_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  litmon_pg:
